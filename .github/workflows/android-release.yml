name: Android Release

# Push a tag like v1.0.0 to trigger a real, signed build on GitHub's runners
# (this repo's sandbox has no network access, so this workflow is the actual
# build — not the sandbox that authored the code).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      # Secrets are optional: if VAULT_KEYSTORE_BASE64 isn't set (e.g. a fork
      # without repo secrets), this step is skipped and the build below
      # produces an unsigned release APK instead of failing.
      - name: Decode signing keystore
        if: ${{ secrets.VAULT_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.VAULT_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "VAULT_KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          echo "VAULT_KEYSTORE_PASSWORD=${{ secrets.VAULT_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VAULT_KEY_ALIAS=${{ secrets.VAULT_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "VAULT_KEY_PASSWORD=${{ secrets.VAULT_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vault-release-apk
          path: android/${{ steps.apk.outputs.path }}

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: android/${{ steps.apk.outputs.path }}
          generate_release_notes: true
          name: Vault ${{ github.ref_name }}
          body: |
            Built automatically by GitHub Actions from tag `${{ github.ref_name }}`.

            Install: download `app-release.apk` below, enable "Install unknown apps"
            for your file manager/browser if prompted, and open the file.

            ${{ secrets.VAULT_KEYSTORE_BASE64 == '' && '⚠️ No release-signing secrets are configured in this repo, so this build is **debug-signed** (installable for testing, but not a real production signature — see RELEASE.md to add a real keystore).' || '' }}
