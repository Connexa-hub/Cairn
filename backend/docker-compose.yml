# Local dev convenience — Render deploys straight from the Dockerfile + render.yaml instead.
version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=dev-only-secret-do-not-use-in-prod
      # SQLite file lives inside the container and won't survive a rebuild —
      # fine for local dev. Point at a real Postgres URL to test persistence.
      - DATABASE_URL=sqlite:///./cairn_backend.db
      - MAX_UPLOAD_MB=50
