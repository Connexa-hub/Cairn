# Render Blueprint — deploy with: Render Dashboard → New → Blueprint → point at
# this repo → set "Blueprint Path" to backend/render.yaml (this file doesn't
# live at the repo root, since the repo also contains android/ and docs/).

services:
  - type: web
    name: cairn-backup-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        sync: false          # set manually in the Render dashboard — never commit this
      - key: DATABASE_URL
        fromDatabase:
          name: cairn-backup-db
          property: connectionString
      - key: MAX_UPLOAD_MB
        # Free-tier Postgres has ~1GB total storage, and backups are stored as
        # database rows (see note below) rather than on a disk, since free-tier
        # web services on Render don't support persistent disks at all. Keep
        # this modest unless you upgrade to a paid Postgres plan.
        value: "50"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
    # No `disk:` block — free-tier web services don't support persistent disks.
    # Encrypted backup blobs are stored as bytea rows in Postgres instead
    # (see app/models/models.py — Backup.data), which IS persistent on the
    # free tier and needs no extra Render feature to survive redeploys.

databases:
  - name: cairn-backup-db
    plan: free
    databaseName: cairn_backup
    user: cairn_backup_user
